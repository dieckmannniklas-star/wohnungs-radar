name: Wohnungs-Radar

on:
  schedule:
    # alle 4 Stunden (Zeiten in UTC; 43 Minuten nach der vollen Stunde)
    - cron: "43 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [config.json]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  suche:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Suche ausführen
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python radar.py

      - name: Ergebnisse speichern
        run: |
          git config user.name "wohnungs-radar"
          git config user.email "wohnungs-radar@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Suche $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
